  const slotHour=BRIEF_SCHED[slot];
  const todayId=briefSchedId(slot,new Date());

  const all=briefMerged().filter(b=>b.slot===slot)
    .sort((a,b)=>String(b.date||b.ts||'').localeCompare(String(a.date||a.ts||'')));
  const today=all.find(b=>b.id===todayId)||null;
  const hist=all.filter(b=>b.id!==todayId);
  const busy=!!ST.inv.briefBusy;
  const nextTxt=briefNextTxt();
  const sameSlotNow=briefSlotNow()===slot;
  const head='<div class="card"><div class="ch"><h3>'+ic(isEve?'moon':'sun',15)+slotLabel+'简报</h3>'+

    '<button class="btn sm '+(busy?'gh':'pri')+'" onclick="briefGenLive(\''+slot+'\',true)" title="未到定时点也可立即拉取最新市场数据生成当日'+slotLabel+'简报">'+ic('refresh',13)+(busy?'生成中…':'立即生成'+slotLabel)+'</button></div>';
  if(BRIEFS===null) return head+'<div class="empty">'+ic('clock',28)+'正在加载简报…</div></div>';
  let body='';
  if(today){
    body+='<div class="sub" style="margin:2px 2px 8px">今日（'+esc(today.date||'')+'）'+slotLabel+'简报 · 已生成并固化，刷新不改动</div>'+
      briefCard(today,M[today.id]||{});
  }else{
    body+='<div class="empty" style="margin:6px 0 10px">'+ic('clock',26)+'今日'+slotLabel+'简报尚未生成'+
      (sameSlotNow?'：当前处于'+slotLabel+'时段，点右上角「立即生成'+slotLabel+'」可即时拉取，或等待 '+slotHour+':00 自动生成'
                  :'：将于今日 '+slotHour+':00 自动生成')+'</div>';
  }
  if(hist.length){
    body+='<div class="sub" style="margin:14px 2px 8px">历史'+slotLabel+'简报（'+hist.length+' 篇）</div>'+
      '<div style="display:flex;flex-direction:column;gap:10px">'+hist.map(b=>briefCard(b,M[b.id]||{})).join('')+'</div>';
  }
  if(!today&&!hist.length){
    body='<div class="empty">'+ic('bulb',30)+'暂无'+slotLabel+'简报：每日 '+slotHour+':00 自动生成（下次 '+nextTxt+'），也可点右上角按钮立即生成</div>';
  }
  return head+body+'</div>';
}
function hlText(raw,hl){
  if(!raw)return '';
  if(!hl||!hl.length)return esc(raw);
  const parts=hl.map(s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  const re=new RegExp('('+parts.join('|')+')','g');
  let out='',last=0,m;
  while((m=re.exec(raw))){
    if(m[0].length===0){re.lastIndex++;continue;}
    out+=esc(raw.slice(last,m.index))+'<mark style="background:#FFE9A8;color:inherit;border-radius:2px;padding:0 1px">'+esc(m[0])+'</mark>';
    last=m.index+m[0].length;
  }
  out+=esc(raw.slice(last));
  return out;
}

/* --- 生理期 --- */
function flv(x){if(typeof x==='number')return x;const m={'多':5,'中':3,'少':1};return m[x]||3;}
const REDS=['#FAD4CE','#F2A39A','#E86A5C','#D23B2E','#9E1B12'];
const PURPLES=['#E4D7F5','#C9AEEC','#A77FE0','#8245CE','#5B1F9E'];
function rgba(hex,a){const m=hex.replace('#','');const r=parseInt(m.slice(0,2),16),g=parseInt(m.slice(2,4),16),b=parseInt(m.slice(4,6),16);return 'rgba('+r+','+g+','+b+','+a+')';}
var LVLC={};
function lvlPick(id,level){
 const cfg=LVLC[id];if(!cfg)return;
 const box=document.getElementById(id+'_bars');if(!box)return;
 box.querySelectorAll('.bar').forEach(b=>{const lv=+b.dataset.lv;b.style.background=(lv===level)?cfg.c[lv-1]:rgba(cfg.c[lv-1],0.3);});
 const lab=document.getElementById(id+'_lab');
 if(lab){let s='';if(level===1&&cfg.min)s='（'+cfg.min+'）';else if(level===5&&cfg.max)s='（'+cfg.max+'）';lab.textContent=level+' / 5'+s;}
 const inp=document.getElementById(id);if(inp)inp.value=level;
}
function hlPeriod(){
 const P=(D.health.period||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
 const last=P[0],prev=P[1];
 const WF={1:'少',2:'较少',3:'中',4:'较多',5:'多'},WP={1:'轻',2:'较轻',3:'中',4:'较重',5:'重'};
 const cyc=last&&prev?dayDiff(last.date,prev.date):null;
 let status='',color='var(--ink3)';
 if(last){
  const d0=pd(last.date),d1=pd(addDay(last.date,(+last.days||1)-1)),td=pd(TODAY);
  if(td>=d0&&td<=d1){const nth=dayDiff(TODAY,last.date)+1;status='🩸 生理期第 '+nth+' / '+(+last.days||1)+' 天';color='var(--red)';}
  else if(cyc){const nx=addDay(last.date,cyc),dn=dayDiff(nx,TODAY);
   if(dn>0){status='预计下次 '+nx+' · 还有 '+dn+' 天';color='var(--brand)';}
   else{status='距上次已 '+dayDiff(TODAY,last.date)+' 天'+(cyc?('（周期约 '+cyc+' 天）'):'');}
  } else status='最近一次 '+last.date;
 }
 const lvl5=(n,cs)=>{n=Math.max(1,Math.min(5,parseInt(n)||1));cs=cs||['var(--green)','#7cb342','var(--brand)','#ef8a3a','var(--red)'];let s='<span style="display:inline-flex;gap:2px;vertical-align:middle">';for(let i=1;i<=5;i++){s+='<i style="width:7px;height:7px;border-radius:2px;display:inline-block;background:'+(i<=n?cs[i-1]:'var(--line2)')+'"></i>';}return s+'</span>';};
 const lvlBar=(lab,n,cs)=>{n=Math.max(1,Math.min(5,parseInt(n)||1));return '<div style="display:flex;align-items:center;gap:8px;flex:1;min-width:120px"><span style="font-size:13px;color:var(--ink2);flex:none">'+lab+'</span><div style="flex:1;height:12px;background:var(--line2);border-radius:7px;overflow:hidden"><div style="height:100%;width:'+(n/5*100)+'%;background:'+cs[n-1]+';border-radius:7px"></div></div></div>';};
 return '<div class="card"><div class="ch"><h3>'+ic('drop',15)+'生理期</h3><div class="sp"></div>'+
  '<button class="btn sm pri" onclick="periodAdd()">'+ic('plus',14)+'记录</button></div>'+
  (status?'<div style="font-size:13px;font-weight:600;color:'+color+';margin-bottom:10px">'+status+'</div>':'')+
  '<div class="grid g2" style="margin-bottom:10px">'+
   stat('最近一次',last?last.date.slice(5):'—',last?('持续 '+(+last.days||1)+' 天 · 血量 '+WF[flv(last.flow)]+' · 痛感 '+WP[flv(last.pain||1)]):'还没有记录','var(--ink)')+
   stat('平均周期',cyc?cyc+' 天':'—',cyc?'按上次推算':'多记几次更准',cyc?'var(--brand)':'var(--ink)')+
  '</div>'+
  '<div style="font-size:11.5px;color:var(--ink3);margin:9px 0 7px;font-weight:600">历次记录（滑动查看）</div>'+
  (P.length?'<div class="lst scroll7">'+P.map(p=>{
   const f=flv(p.flow),pn=flv(p.pain||1);
   return '<div class="li"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px">'+
   '<div class="gr"><div class="t1">'+p.date+' 起 · 共 '+(+p.days||1)+' 天</div></div>'+
   '<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">'+
   lvlBar('血量',f,REDS)+
   lvlBar('痛感',pn,PURPLES)+
   '</div>'+
   (p.note?'<div class="t2" style="margin-top:1px">'+esc(p.note)+'</div>':'')+
   '</div>'+
   '<button class="btn sm gh" onclick="periodAdd(\''+esc(p.id)+'\')">'+ic('edit',12)+'</button>'+
   '<button class="btn sm gh dg" onclick="delItem(D.health.period,\''+esc(p.id)+'\',\'生理期记录\')">'+ic('trash',12)+'</button></div>';}).join('')+'</div>'
  :'<div class="empty">'+ic('drop',28)+'记录第一次吧</div>')+'</div>';
}
function periodAdd(id){
 const e=id?(D.health.period||[]).find(x=>x.id===id):null;
 formM(e?'编辑生理期记录':'记录生理期',[
  {id:'pg_d',l:'开始日期',t:'date',v:e?e.date:TODAY,req:1},
  {id:'pg_n',l:'持续天数',t:'number',v:e?e.days:5,step:'1',req:1},
  {id:'pg_f',l:'血量（点选等级）',t:'lvl',min:'最少',max:'最多',colors:['#FAD4CE','#F2A39A','#E86A5C','#D23B2E','#9E1B12'],v:e?flv(e.flow):3},
  {id:'pg_p',l:'痛感（点选等级）',t:'lvl',min:'无',max:'剧烈',colors:['#E4D7F5','#C9AEEC','#A77FE0','#8245CE','#5B1F9E'],v:e?(e.pain||1):1},
  {id:'pg_no',l:'备注',v:e?e.note:'',p:'身体感受 / 症状'},
 ],()=>{
  const d=val('pg_d');if(!d){toast('请选择开始日期');return false}
  const days=Math.max(1,parseInt(val('pg_n'))||1);
  const o={id:e?e.id:uid(),date:d,days:days,flow:parseInt(val('pg_f')),pain:parseInt(val('pg_p')),note:val('pg_no')};
  if(e)Object.assign(e,o);else{(D.health.period=D.health.period||[]).push(o);}
  save();toast(e?'已更新':'已记录');
 });
}

function studyRec(){ D.study=D.study||{records:{}}; return D.study.records; }
function studyCheck(cb,key){
  const R=studyRec(),r=R[key]||(R[key]={done:false,date:''});
  r.done=!!cb.checked;
  if(r.done&&!r.date)r.date=TODAY;
  if(!r.done)r.date='';
  save(true);
  const row=cb.closest?cb.closest('.srow'):null; if(row)row.classList.toggle('done',r.done);
  const di=row?row.querySelector('.sdate'):null; if(di)di.value=r.date;
  studyProgress();
}
function studySetDate(key,v){
  const R=studyRec(),r=R[key]||(R[key]={done:false,date:''});
  r.date=v||''; save(true);
}
function studyProgress(){
  const bar=document.getElementById('sbar'),txt=document.getElementById('stxt'); if(!bar||!txt)return;
  const R=studyRec(); let done=0,total=0;
  STUDY.forEach(mo=>{
    mo.ws.forEach(wk=>{
      wk._items.forEach(it=>{ total++; if(R[it.key]&&R[it.key].done)done++; });
    });
  });
  const pct=total?Math.round(done/total*100):0;
  bar.style.width=pct+'%'; txt.innerHTML='已完成 <b style="color:var(--brand)">'+done+'</b> / '+total+' 项（'+pct+'%）';
}
function studyReset(){
  confirmM('重置学习打卡','将清空全部勾选与打卡日期，确定吗？',()=>{ D.study={records:{}}; save(); render(); toast('已重置'); });
}
function seTask(it){const o=D.study.edits&&D.study.edits[it.key];return o&&o.task!=null?o.task:it.task;}
function seReq(it){const o=D.study.edits&&D.study.edits[it.key];return o&&o.req!=null?o.req:it.req;}
function studyEdit(key){
  let found=null;
  STUDY.forEach(mo=>mo.ws.forEach(wk=>wk._items.forEach(it=>{if(it.key===key)found=it;})));
  if(!found)return;
  const o=(D.study.edits&&D.study.edits[key])||{};
  const task=o.task!=null?o.task:found.task;
  const req=o.req!=null?o.req:found.req;
  formM('编辑学习任务',[
    {id:'_et',l:'学习任务',v:task,t:'ta',h:52},
    {id:'_er',l:'要求（完成标准）',v:req,t:'ta',h:84}
  ],()=>{
    const t=val('_et'),r=val('_er');
    if(!t.trim()){toast('学习任务不能为空');return false;}
    D.study.edits=D.study.edits||{};
    D.study.edits[key]={task:t,req:r};
    save(); render(); toast('已更新');
  },540);
}
function R_study(){
  const R=studyRec();
  let done=0,total=0;
  STUDY.forEach(mo=>{
    mo.ws.forEach(wk=>{
      wk._items.forEach(it=>{ total++; if(R[it.key]&&R[it.key].done)done++; });
    });
  });
  const pct=total?Math.round(done/total*100):0;
  let h='<div class="card" style="margin-bottom:14px">'+chH('check','学习打卡 · 双碳知识库计划','双碳知识体系 · 至 2026 年底',
    '<button class="btn sm" onclick="studyReset()">重置进度</button>')+
    '<div style="display:flex;align-items:center;gap:12px">'+
    '<div style="flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden"><i id="sbar" style="display:block;height:100%;width:'+pct+'%;background:var(--brand);transition:width .3s"></i></div>'+
    '<span id="stxt" style="font-size:13px;color:var(--ink2);white-space:nowrap">已完成 <b style="color:var(--brand)">'+done+'</b> / '+total+' 项（'+pct+'%）</span></div></div>';
  h+='<div class="card" style="padding:0">';
  STUDY.forEach(mo=>{
    const mc=mo.ws.reduce((a,wk)=>a+(wk._items?wk._items.length:0),0);
    h+='<details class="sgrp" open><summary><span class="stitle">'+esc(mo.m)+'<span class="smeta">（'+mo.ws.length+' 周 · '+mc+' 项）</span></span><span class="chev">▸</span></summary>';
    mo.ws.forEach(wk=>{
      h+='<details class="swk" open><summary><span class="stitle2"><span class="sw">'+esc(wk.w)+'</span>'+esc(wk.g)+'</span><span class="chev2">▸</span></summary>';
      h+='<table class="study-tbl"><thead><tr>'+
        '<th style="width:92px">日 / 主题</th><th style="width:34%">学习任务</th><th style="width:43%">要求</th><th style="width:54px">完成</th><th style="width:132px">打卡日期</th><th style="width:58px">编辑</th></tr></thead><tbody>';
      const its=wk._items,n=its.length;
      const eReq=its.map(it=>seReq(it));
      const rRun=new Array(n);
      let i=0;
      while(i<n){ let j=i; const r0=eReq[i];
        while(j+1<n && eReq[j+1]===r0) j++;
        for(let k=i;k<=j;k++) rRun[k]={rs:j-i+1,start:k===i};
        i=j+1; }
      its.forEach((it,ti)=>{
        const rec=R[it.key]||{},dc=rec.done?' done':'';
        const rR=rRun[ti];
        const sd=`<td class="sd"><span class="stag t-${it.typ}">${STYP[it.typ]?STYP[it.typ].n:it.typ}</span>${it.lvl?'<span class="slvl">'+esc(it.lvl)+'</span>':''}</td>`;
        const sr=rR.start?`<td class="sr" rowspan="${rR.rs}">${esc(eReq[ti]||'')}</td>`:'';
        h+=`<tr class="srow${dc}" data-skey="${it.key}">`+
          sd+
          `<td class="st">${it.star?'✨ ':''}${esc(seTask(it))}</td>`+
          sr+
          `<td class="sc"><input type="checkbox" class="scb" ${rec.done?'checked':''} onclick="studyCheck(this,'${it.key}')"></td>`+
          `<td class="sdt"><input type="date" class="sdate" value="${rec.date||''}" onchange="studySetDate('${it.key}',this.value)"></td>`+
          `<td class="se"><button class="seditbtn" title="编辑本行" onclick="studyEdit('${it.key}')">✎</button></td>`+
        '</tr>';
      });
      h+='</tbody></table>';
      /* 移动端：每行为独立堆叠卡片（窄屏显示，桌面隐藏） */
      h+='<div class="study-list">';
      its.forEach(it=>{
        const rec=R[it.key]||{},dc=rec.done?' done':'';
        h+=`<div class="scard srow${dc}" data-skey="${it.key}">
          <div class="sl inline"><span class="sk">类型</span><span class="sv"><span class="stag t-${it.typ}">${STYP[it.typ]?STYP[it.typ].n:it.typ}</span>${it.lvl?' <span class="slvl">'+esc(it.lvl)+'</span>':''}</span></div>
          <div class="sl"><span class="sk">学习任务</span><span class="sv">${it.star?'\u2728 ':''}${esc(seTask(it))}</span></div>
          <div class="sl"><span class="sk">要求</span><span class="sv">${esc(seReq(it))}</span></div>
          <div class="sl inline"><span class="sk">完成</span><label class="sccb"><input type="checkbox" class="scb" ${rec.done?'checked':''} onclick="studyCheck(this,'${it.key}')"> 标记完成</label></div>
          <div class="sl inline"><span class="sk">打卡日期</span><input type="date" class="sdate" value="${rec.date||''}" onchange="studySetDate('${it.key}',this.value)"></div>
          <div class="sl inline"><span class="sk">编辑</span><button class="seditbtn" onclick="studyEdit('${it.key}')">\u270e 编辑本行</button></div>
        </div>`;
      });
      h+='</div>';
      h+='</details>';
    });
    h+='</details>';
  });
  h+='</div>';
  return h;
}

function rdPlan(){
 const books=(D.reading.books||[]).slice();
 let h='<div class="card"><div class="ch"><h3>'+ic('book',15)+'阅读计划</h3><div class="sp"></div>'+
  '<button class="btn sm pri" onclick="rdBookAdd()">'+ic('plus',14)+'加书</button></div>';
 if(!books.length){return h+'<div class="empty">'+ic('book',28)+'书架还空，加一本想读的书</div></div>';}
 const withPlan=books.filter(b=>b.plan).sort((a,b)=>a.plan.localeCompare(b.plan));
 const noPlan=books.filter(b=>!b.plan);
 const tree={};
 withPlan.forEach(b=>{const y=b.plan.slice(0,4),m=b.plan.slice(5,7);tree[y]=tree[y]||{};tree[y][m]=tree[y][m]||[];tree[y][m].push(b)});
 const years=Object.keys(tree).sort();
 if(years.length){
  years.forEach(y=>{h+='<div style="margin:10px 0 2px;font-weight:700;font-size:14px;color:var(--ink)">'+y+' 年</div>';
   Object.keys(tree[y]).sort().forEach(m=>{
    h+='<div style="margin:7px 0 5px 8px;font-size:12.5px;color:var(--ink3);font-weight:600">'+parseInt(m,10)+' 月 · 计划完成</div>';
    h+='<div class="grid g2" style="gap:9px;margin-left:8px;margin-bottom:6px">'+tree[y][m].map(planCard).join('')+'</div>';
   });
  });
 }else{
  h+='<div class="empty">'+ic('book',24)+'还没有排期计划的书，给想读的书设一个「计划完成阅读时间」吧</div>';
 }
 if(noPlan.length){
  h+='<div style="margin:12px 0 4px;font-weight:700;font-size:14px;color:var(--brand)">想读（未排期）</div>';
  h+='<div class="grid g2" style="gap:9px">'+noPlan.map(planCard).join('')+'</div>';
 }
 return h+'</div>';
}

  '<button class="btn sm pri" onclick="funMovieAdd()">'+ic('plus',14)+'想看</button></div>'+
  (L.length?L.map(m=>{const done=m.status!=='want',open=done&&exp[m.id];
   if(done&&!open)return '<div class="li" onclick="funExp(\''+esc(m.id)+'\')" style="cursor:pointer;opacity:.7"><span class="tag g">已看</span>'+
    '<div class="gr"><div class="t1">'+esc(m.name)+(m.platform?(' · '+esc(m.platform)):'')+'</div></div>'+

function R_social(){
 ST.social=ST.social||{tab:'people'};
 const S=D.social,people=S.people||[],contacts=S.contacts||[],gOut=S.giftsOut||[],gIn=S.giftsIn||[];
 const due=contacts.filter(c=>!c.done&&c.next&&c.next<=TODAY).length;
 const bday=people.filter(p=>nextAnnivDays(p.birth)!=null&&nextAnnivDays(p.birth)<=7).length;
 const tab=(k,n)=>'<div class="tab'+(ST.social.tab===k?' on':'')+'" onclick="ST.social.tab=\''+k+'\';render()">'+n+'</div>';
 return '<div class="grid g4 keep4" style="margin-bottom:14px">'+
  stat('重要联系人',people.length+' 人','用心经营','var(--ink)')+stat('待跟进',due+' 项','别冷落了','var(--brand)')+
  stat('临近生日',bday+' 人','提前准备','var(--red)')+stat('送礼清单',gOut.length+' 条','投其所好','var(--green)')+'</div>'+
  '<div class="tabs" style="margin-bottom:14px">'+tab('people','联系人')+tab('contact','社交记录')+tab('gift','礼物')+tab('gin','收礼')+'</div>'+
  (ST.social.tab==='people'?socPeople():ST.social.tab==='contact'?socContact():ST.social.tab==='gift'?socGift():socGin());
}

/* ==================== 🤖 数字管家 ==================== */
function R_digital(){
 ST.digital=ST.digital||{tab:'sub',gf:'all',gq:'',gcat:'',sel:[],edit:false};
 const G=D.digital,subs=G.subs||[],goods=G.goods||[],assets=G.assets||[];
 const expSoon=subs.filter(s=>s.date&&dayDiff(s.date,TODAY)<=7&&dayDiff(s.date,TODAY)>=0).length;
 const expGoods=goods.filter(g=>gRem(g)>0&&g.exp&&dayDiff(g.exp,TODAY)<=90&&dayDiff(g.exp,TODAY)>=0).length;
 const tab=(k,n)=>'<div class="tab'+(ST.digital.tab===k?' on':'')+'" onclick="ST.digital.tab=\''+k+'\';render()">'+n+'</div>';
 return '<div class="grid g4 keep4" style="margin-bottom:14px">'+
  stat('订阅',subs.length+' 项','别被自动扣费偷袭','var(--ink)')+stat('7 天内到期',expSoon+' 项','及时续费/退订','var(--red)')+
  stat('数字资产',assets.length+' 项','账号云盘索引','var(--ink)')+stat('临期消耗品',expGoods+' 项','3 个月内','var(--brand)')+'</div>'+
  '<div class="tabs" style="margin-bottom:14px">'+tab('sub','订阅管理')+tab('asset','数字资产')+tab('goods','消耗品')+'</div>'+
  (ST.digital.tab==='sub'?digSub():ST.digital.tab==='asset'?digAsset():digGoods());
}

  '<button class="btn sm pri" onclick="digSubAdd()">'+ic('plus',14)+'添加</button></div>'+
  (L.length?L.map(s=>{const d=s.date?dayDiff(s.date,TODAY):null;const tag=d==null?'无期限':d<0?'已过期':d===0?'今天到期':'还有 '+d+' 天';
   return '<div class="li"><span class="tag '+(d==null?'b':d<0?'r':d<=7?'r':'o')+'">'+(tag)+'</span>'+
   '<div class="gr"><div class="t1">'+esc(s.name)+(s.fee?(' · '+money0(s.fee)+'/'+(s.cycle||'年')):'')+(s.auto?' · 自动续':'')+'</div>'+
   '<div class="t2">'+(s.date?('到期 '+s.date):'')+(s.note?(' · '+esc(s.note)):'')+'</div></div>'+
   '<button class="btn sm gh" onclick="digSubAdd(this.dataset.id)" data-id="'+esc(s.id)+'">'+ic('edit',12)+'</button>'+
   '<button class="btn sm gh dg" onclick="delItem(D.digital.subs,this.dataset.id,this.dataset.label)" data-id="'+esc(s.id)+'" data-label="订阅">'+ic('trash',12)+'</button></div>';}).join('')
   :'<div class="empty">'+ic('wallet',28)+'把会员/订阅记下来</div>')+'</div>';
}

}
function gCatOf(g){return (g.cat||'')+(g.sub?(' / '+g.sub):'')}
function gUQ(g){return g.usedQty!=null?g.usedQty:(g.used?(g.qty||1):0)}
function gRem(g){return (g.qty||1)-gUQ(g)}
function digGoods(){
 const STd=ST.digital,L=(D.digital.goods||[]).slice();
 const cats=[...new Set(L.map(gCatOf).filter(Boolean))].sort();
 const ilog=D.digital.importLog||[];const ifsum=ilog.reduce((s,e)=>s+(e.fail||0),0);
 const igIds=D.digital.ignoreGoods||[];const ign=(D.digital.goods||[]).filter(g=>igIds.includes(g.id)).length;
 const header='<div class="ch"><h3>'+ic('box',15)+'消耗品清单</h3><div class="sp"></div>'+
  '<button class="btn sm pri" onclick="digGoodsAdd()">'+ic('plus',14)+'添加</button>'+
  '<button class="btn sm" onclick="digGoodsImport()">'+ic('upload',14)+'表格导入</button>'+
  '<button class="btn sm" onclick="digGoodsTemplate()">'+ic('down',14)+'模板</button>'+
  '<button class="btn sm" onclick="digExport()">'+ic('down',14)+'导出表单</button>'+
  '<button class="btn sm" onclick="digImportLog()">'+ic('history',14)+'导入记录'+(ifsum?' <span class="num" style="color:var(--red)">'+ifsum+'</span>':'')+'</button>'+
  '<button class="btn sm'+(ign?' pri':'')+'" onclick="digIgnoredList()">'+ic('hide',14)+'已忽略'+(ign?' '+ign:'')+'</button>'+
  '<button class="btn sm'+(ST.digital.edit?' pri':'')+'" onclick="digToggleEdit()">'+ic('edit',14)+'编辑'+(ST.digital.edit?'（批量）':'')+'</button></div>';
 const filterbar='<div style="display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px">'+
  '<input class="inp" id="gq" style="flex:2;min-width:0" placeholder="搜索名称/类别" value="'+esc(STd.gq||'')+'" oninput="if(event.isComposing||event.keyCode===229)return;ST.digital.gq=this.value;digGoodsApply()" oncompositionend="ST.digital.gq=this.value;digGoodsApply()" onkeydown="if(event.keyCode===13&&!event.isComposing){event.preventDefault();ST.digital.gq=this.value;digGoodsApply();}">'+'<button class="btn sm pri" onclick="ST.digital.gq=this.previousElementSibling.value;digGoodsApply()">搜索</button>'+
  '<select class="sel" style="flex:1;min-width:0" onchange="ST.digital.gcat=this.value;digGoodsApply()"><option value="">全类别</option>'+cats.map(c=>'<option value="'+esc(c)+'"'+(STd.gcat===c?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select></div>';
 const th='<div class="goodsHead">'+
  (ST.digital.edit?'<div class="gEdit"></div>':'')+
  '<div class="gInfo">'+
  '<div style="text-align:left">类别</div><div style="text-align:left">名称</div><div style="text-align:left">规格</div><div style="text-align:left">数量</div><div style="text-align:left">有效期</div><div style="text-align:left">备注</div>'+
  '</div><div class="gOp" style="text-align:right">操作</div></div>';
 return '<div class="card">'+header+filterbar+
  '<div id="goodsChips">'+digGoodsChips()+'</div>'+
  '<div id="goodsBatch">'+digGoodsBatchBar()+'</div>'+th+
  '<div id="goodsRows">'+digGoodsRows()+'</div></div>';
}
function digGoodsAdd(id){
 const g=id?(D.digital.goods||[]).find(x=>x.id===id):null;
 formM(g?'编辑消耗品':'添加消耗品',[{id:'dg_c',l:'类别',v:g?gCatOf(g):'',req:1,p:'如 护肤 / 面膜，或 药品'},{id:'dg_n',l:'名称',v:g?g.name:'',req:1},
  {id:'dg_sp',l:'规格',v:g?g.spec:'',p:'如 片 / 盒 / 袋'},
  {id:'dg_q',l:'数量',t:'number',v:g?(g.qty||1):1,step:'1'},{id:'dg_e',l:'有效期（可选）',t:'date',v:g?g.exp:''},
  {id:'dg_no',l:'备注（可选）',t:'ta',v:g?g.note:'',h:46,p:'存放位置 / 开封日期等'}],
  ()=>{const n=val('dg_n'),c=val('dg_c');if(!n||!c){toast('请填名称和类别');return false}
   const o={id:g?g.id:uid(),cat:c,name:n,spec:val('dg_sp'),qty:Math.max(1,Math.floor(nval('dg_q'))),exp:val('dg_e')||'',note:val('dg_no')||''};
   if(g){o.usedQty=g.usedQty!=null?g.usedQty:(g.used?(g.qty||1):0);Object.assign(g,o);}else{(D.digital.goods=D.digital.goods||[]).push(Object.assign(o,{usedQty:0}));}
   save();toast(g?'已更新':'已添加');});
}
function digGoodsUse(id){const g=(D.digital.goods||[]).find(x=>x.id===id);if(!g)return;
 const qty=g.qty||1,u=gUQ(g),rem=qty-u;
 if(rem<=0){toast('已用完，可点「恢复」退回');return}
 const nu=Math.min(qty,u+1);g.usedQty=nu;g.used=undefined;save();digGoodsApply();toast(nu>=qty?'已全部用完（剩 0）':'已用 1 个，剩 '+(qty-nu));
}
function digGoodsRecover(id){const g=(D.digital.goods||[]).find(x=>x.id===id);if(!g)return;
 const u=gUQ(g);
 if(u<=0){toast('尚未记录使用');return}
 const nu=Math.max(0,u-1);g.usedQty=nu;if(nu<=0)g.used=false;save();digGoodsApply();toast('已恢复 1 个（剩 '+(g.qty-nu)+'）');
}
function goodsCol(){return 'display:flex;align-items:center;gap:8px;';}
function goodsIsNear(g){const d=g.exp?dayDiff(g.exp,TODAY):null;return d!=null&&d>=0&&d<=90&&gRem(g)>0;}
function goodsIsExp(g){const d=g.exp?dayDiff(g.exp,TODAY):null;return d!=null&&d<0&&gRem(g)>0;}
function digGoodsBase(){
 const STd=ST.digital,q=(STd.gq||'').toLowerCase();
 return (D.digital.goods||[]).filter(g=>(!q||(g.name||'').toLowerCase().includes(q)||gCatOf(g).toLowerCase().includes(q))&&(!STd.gcat||gCatOf(g)===STd.gcat));
}
function digGoodsChips(){
 const STd=ST.digital,f=STd.gf||'all',base=digGoodsBase();
 const cnt=k=>k==='all'?base.length:k==='used'?base.filter(g=>gUQ(g)>0).length:k==='unused'?base.filter(g=>gUQ(g)===0).length:k==='near'?base.filter(goodsIsNear).length:base.filter(goodsIsExp).length;
 const chip=(k,n)=>'<div class="tab'+(f===k?' on':'')+'" onclick="ST.digital.gf=\''+k+'\';digGoodsApply()" style="padding:5px 10px;font-size:12px">'+n+'</div>';
 return '<div style="display:flex;gap:5px;margin:4px 0 10px;flex-wrap:wrap">'+chip('all','全部 '+cnt('all'))+chip('unused','未使用 '+cnt('unused'))+chip('used','已用 '+cnt('used'))+chip('near','临期 '+cnt('near'))+chip('expired','已过期 '+cnt('expired'))+'</div>';
}
function digGoodsVisible(){
 const STd=ST.digital,f=STd.gf||'all',base=digGoodsBase();
 return base.filter(g=>f==='all'?true:f==='used'?gUQ(g)>0:f==='unused'?(gUQ(g)===0):f==='near'?goodsIsNear(g):f==='expired'?goodsIsExp(g):true);
}
function digGoodsBatchBar(){
 const STd=ST.digital;
 if(!STd.edit)return '';
 const sel=STd.sel||(STd.sel=[]);
 const vis=window.__goodsVis||[];
 const selAll=vis.length>0&&vis.every(id=>sel.includes(id));
 const n=sel.length;
 return '<div style="display:flex;align-items:center;gap:9px;margin:1px 0 9px;flex-wrap:wrap">'+
  '<label style="display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--ink3);cursor:pointer">'+
  '<input type="checkbox" '+(selAll?'checked':'')+' onchange="digSelAll(this.checked)" style="width:16px;height:16px;accent-color:var(--brand)">全选</label>'+
  '<span class="tag">已选 '+n+' 条</span>'+
  '<button class="btn sm dg" onclick="digDelSel()" '+(n?'':'disabled style="opacity:.5;cursor:not-allowed"')+'>'+ic('trash',13)+'删除选中</button>'+
  '<button class="btn sm" onclick="digSelClear()">取消选择</button>'+
  '</div>';
}
function digGoodsRows(){
 const STd=ST.digital,f=STd.gf||'all',base=digGoodsBase();
 const fl=digGoodsVisible();
 window.__goodsVis=fl.map(g=>g.id);
 const sel=ST.digital.sel||[];
 if(!fl.length)return '<div class="empty">'+ic('box',28)+'没有匹配的消耗品</div>';
 return fl.map(g=>{const d=g.exp?dayDiff(g.exp,TODAY):null,near=d!=null&&d<=90&&d>=0,expd=d!=null&&d<0;
  const rem=gRem(g),uq=gUQ(g),tot=g.qty||1,full=rem===0;
  const row=goodsCol()+(full?'opacity:.55':near?'background:var(--yellow-s)':'');
  const qCell=rem>0?(uq>0?(rem+'<div style="font-size:10.5px;color:var(--ink3)">共'+tot+'·已用'+uq+'</div>'):(''+rem)):('0<div style="font-size:10.5px;color:var(--red)">已用完</div>');
  return '<div class="goodsRow" style="'+row+'">'+
   (ST.digital.edit?'<div class="gEdit"><input type="checkbox" '+(sel.includes(g.id)?'checked':'')+' onchange="digToggleSel(\''+g.id+'\')" style="width:16px;height:16px;accent-color:var(--brand)"></div>':'')+
   '<div class="gInfo">'+
   '<div style="min-width:0;overflow:hidden"><span class="glb">类别</span>'+(gCatOf(g)?esc(gCatOf(g)):'<span style="color:var(--ink3)">—</span>')+'</div>'+
   '<div style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><span class="glb">名称</span>'+esc(g.name)+'</div>'+
   '<div style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><span class="glb">规格</span>'+(g.spec?esc(g.spec):'<span style="color:var(--ink3)">—</span>')+'</div>'+
   '<div><span class="glb">数量</span>'+qCell+'</div>'+
   '<div style="min-width:0"><span class="glb">有效期</span>'+(g.exp?(g.exp+(near?' <span style="color:var(--brand)">⚠️</span>':(expd?' <span style="color:var(--red)">已过期</span>':''))):'<span style="color:var(--ink3)">—</span>')+'</div>'+
   '<div style="min-width:0;overflow:hidden"><span class="glb">备注</span>'+(g.note?esc(g.note):'<span style="color:var(--ink3)">—</span>')+'</div>'+
   '</div>'+
   '<div class="gOp">'+
    (rem>0?'<button class="btn sm gh" onclick="digGoodsUse(this.dataset.id)" data-id="'+esc(g.id)+'" title="用掉 1 个">'+ic('check',12)+'</button>':'')+
    (uq>0?'<button class="btn sm gh" onclick="digGoodsRecover(this.dataset.id)" data-id="'+esc(g.id)+'" title="恢复 1 个（防误点）">'+ic('refresh',12)+'</button>':'')+
    '<button class="btn sm gh" onclick="digGoodsAdd(this.dataset.id)" data-id="'+esc(g.id)+'" title="编辑">'+ic('edit',12)+'</button>'+
    '<button class="btn sm gh dg" onclick="delItem(D.digital.goods,this.dataset.id,this.dataset.label)" data-id="'+esc(g.id)+'" data-label="消耗品">'+ic('trash',12)+'</button>'+
   '</div></div>';
 }).join('');
}
function digGoodsApply(){
 const c=document.getElementById('goodsChips');if(c)c.innerHTML=digGoodsChips();
 const b=document.getElementById('goodsBatch');if(b)b.innerHTML=digGoodsBatchBar();
 const r=document.getElementById('goodsRows');if(r)r.innerHTML=digGoodsRows();
}
function digToggleSel(id){ST.digital.sel=ST.digital.sel||[];const i=ST.digital.sel.indexOf(id);if(i>=0)ST.digital.sel.splice(i,1);else ST.digital.sel.push(id);digGoodsApply();}
function digToggleEdit(){ST.digital.edit=!ST.digital.edit;if(!ST.digital.edit)ST.digital.sel=[];render();}
function digSelAll(on){const vis=window.__goodsVis||[];ST.digital.sel=on?vis.slice():[];digGoodsApply();}
function digSelClear(){ST.digital.sel=[];digGoodsApply();}
function digDelSel(){const sel=ST.digital.sel||[];if(!sel.length){toast('请先勾选要删除的消耗品');return}const n=sel.length;confirmM('删除选中的 '+n+' 个消耗品','确定删除选中的 <b>'+n+'</b> 个消耗品吗？此操作不可撤销。',()=>{const s=new Set(sel);D.digital.goods=D.digital.goods.filter(g=>!s.has(g.id));ST.digital.sel=[];save();digGoodsApply();toast('已删除 '+n+' 个');},'删除');}

/* --- 导入记录 / 导出表单 --- */
function digImportLog(){
 const L=D.digital.importLog||[];
 let h;
 if(!L.length){
  h='<div class="empty">'+ic('history',30)+'还没有导入记录</div>';
 }else{
  h='<div style="font-size:11.5px;color:var(--ink3);margin-bottom:10px;line-height:1.6">每次表格导入都会记录时间与失败明细（最多保留 30 次）。</div>'+
  '<div class="lst scroll7" style="max-height:60vh">'+

function digExportGo(){
 const L=(D.digital.goods||[]);
 if(!L.length){toast('没有可导出的消耗品');return}
 const rows=[['类别','名称','规格','数量','已用数量','有效期','备注']];
 L.slice().sort((a,b)=>gCatOf(a).localeCompare(gCatOf(b))||a.name.localeCompare(b.name)).forEach(g=>{
  rows.push([gCatOf(g),g.name,g.spec||'',g.qty,g.usedQty!=null?g.usedQty:(g.used?(g.qty||1):0),g.exp||'',g.note||'']);
 });
 const txt='\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
 dl('消耗品-'+TODAY+'.csv',txt,'text/csv;charset=utf-8');
 closeM();toast('已导出 '+L.length+' 条消耗品');

 function digGoodsParse(rows){
  const out=[];const fails=[];
  if(!rows||!rows.length)return {arr:out,fails:fails,ok:0,fail:0};
  let map=null,start=0;
  const hdr=rows[0].map(x=>String(x||'').trim());
  const kw=a=>hdr.findIndex(h=>h&&a.some(k=>h.indexOf(k)>=0));
  const iCat=kw(['类别','类']),iName=kw(['名称','名']),iSpec=kw(['规格']),iQty=kw(['数量','个数']),iUq=kw(['已用','消耗','用过']),iExp=kw(['有效期','到期']),iNote=kw(['备注','注']);
  if([iCat,iName,iSpec,iQty,iUq,iExp,iNote].filter(x=>x>=0).length>=2){
   map={cat:iCat<0?99:iCat,name:iName<0?99:iName,spec:iSpec<0?99:iSpec,qty:iQty<0?99:iQty,uq:iUq<0?99:iUq,exp:iExp<0?99:iExp,note:iNote<0?99:iNote};start=1;
  }
  const POS={cat:0,name:1,spec:2,qty:3,uq:4,exp:5,note:6};
  for(let i=start;i<rows.length;i++){
   const r=rows[i];if(!r||!r.some(x=>String(x||'').trim()!==''))continue;
   const line=i+1;
   const raw=r.map(x=>String(x||'').trim()).join(',');
   const get=(k,d)=>{const j=map?map[k]:POS[k];const v=String(r[j]==null?'':r[j]).trim();return v===''?(d||''):v;};
   const cat=get('cat'),name=get('name'),spec=get('spec');
   if(!name||!cat){fails.push({line:line,raw:raw,reason:'缺少「名称」或「类别」'});continue;}
   const qv=get('qty','');
   let qty;
   if(qv===''){qty=1;}
   else{const n=Math.floor(parseFloat(String(qv).replace(/[^\d.]/g,'')));if(!n||n<1){fails.push({line:line,raw:raw,reason:'「数量」缺失或非正整数'});continue;}qty=n;}
   const uq=Math.max(0,Math.floor(parseFloat(get('uq','0').replace(/[^\d.]/g,''))||0));
   const exp=get('exp'),note=get('note');
   out.push({id:uid(),cat,name,spec,qty,exp:exp||'',usedQty:Math.min(uq,qty),note});
  }
  return {arr:out,fails:fails,ok:out.length,fail:fails.length};
 }
 function digGoodsGo(){
  pickCsv(rows=>{
   const r=digGoodsParse(rows);
   if(!r.arr.length&&!r.fail){toast('没有可导入的数据（已自动跳过表头）');return}
   (D.digital.goods=D.digital.goods||[]).push(...r.arr);
   (D.digital.importLog=D.digital.importLog||[]).unshift({ts:Date.now(),t:new Date().toLocaleString('zh-CN'),ok:r.ok,fail:r.fail,fails:r.fails});
   if(D.digital.importLog.length>30)D.digital.importLog.length=30;
   closeM();save();digGoodsApply();
   if(r.fail)toast('导入成功 '+r.ok+' 条，跳过 '+r.fail+' 条（见「导入记录」）');
   else toast('导入成功 '+r.ok+' 条');
  });
 }
